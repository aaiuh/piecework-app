<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>计件工作记录</title>
<meta name="theme-color" content="#1976D2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="计件记录">
<link rel="manifest" href="manifest.json">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --primary: #1976D2;
  --primary-light: #E3F2FD;
  --accent: #FF6F00;
  --danger: #E53935;
  --bg: #F5F7FA;
  --card: #fff;
  --text: #212121;
  --text2: #757575;
  --border: #E0E0E0;
  --radius: 12px;
  --tab-h: 56px;
  --header-h: 56px;
}
body {
  font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.header {
  height: var(--header-h);
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  flex-shrink: 0;
}
.header-title { font-size: 18px; font-weight: 600; }
.header-date { font-size: 13px; opacity: 0.85; }
.header-total { font-size: 20px; font-weight: 700; color: #FFD54F; }
.main {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.page {
  display: none;
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  padding-bottom: calc(var(--tab-h) + 12px);
}
.page.active { display: block; }
.tab-bar {
  height: var(--tab-h);
  background: var(--card);
  display: flex;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.tab-btn {
  flex: 1;
  border: none;
  background: none;
  font-size: 11px;
  color: var(--text2);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  position: relative;
}
.tab-btn .tab-icon { font-size: 20px; }
.tab-btn.active { color: var(--primary); }
.tab-btn.active::after {
  content: '';
  position: absolute;
  top: 0; left: 10%; right: 10%;
  height: 3px;
  background: var(--primary);
  border-radius: 0 0 3px 3px;
}
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
  margin-bottom: 12px;
  overflow: hidden;
}
.card-header {
  padding: 12px 16px;
  background: var(--primary-light);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-header h3 { font-size: 15px; color: var(--primary); font-weight: 600; }
.summary-bar {
  background: var(--primary);
  color: #fff;
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.summary-bar .label { font-size: 13px; opacity: 0.85; }
.summary-bar .value { font-size: 26px; font-weight: 700; }
.record-item {
  display: flex;
  align-items: flex-start;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  gap: 8px;
}
.record-item:last-child { border-bottom: none; }
.record-info { flex: 1; }
.record-title { font-size: 15px; font-weight: 600; }
.record-meta { font-size: 12px; color: var(--text2); margin-top: 3px; line-height: 1.6; }
.record-amount { font-size: 15px; color: var(--accent); font-weight: 700; text-align: right; }
.record-qty { font-size: 12px; color: var(--text2); }
.delete-btn {
  background: none;
  border: none;
  font-size: 20px;
  color: #ccc;
  cursor: pointer;
  padding: 0 4px;
  line-height: 1;
}
.add-btn {
  width: 100%;
  padding: 12px;
  border: 2px dashed var(--primary);
  background: var(--primary-light);
  color: var(--primary);
  border-radius: var(--radius);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}
.save-row { padding: 12px 16px; }
.btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: var(--radius);
  font-size: 16px;
  cursor: pointer;
  font-weight: 500;
}
.btn-primary { background: var(--primary); color: #fff; }
.empty-tip { text-align: center; color: var(--text2); padding: 32px 16px; }
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 100;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #fff;
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 480px;
  padding: 20px;
  max-height: 90vh;
  overflow-y: auto;
}
.modal h3 { font-size: 17px; font-weight: 700; margin-bottom: 16px; text-align: center; }
.form-group { margin-bottom: 14px; }
.form-group label { font-size: 13px; color: var(--text2); margin-bottom: 5px; display: block; }
.form-group input,
.form-group select {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px 14px;
  font-size: 15px;
  background: #fff;
  appearance: none;
  -webkit-appearance: none;
}
.select-wrap { position: relative; }
.select-wrap::after {
  content: '▼';
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text2);
  pointer-events: none;
  font-size: 12px;
}
.modal-btns { display: flex; gap: 10px; margin-top: 18px; }
.modal-btns button {
  flex: 1;
  padding: 13px;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
  font-weight: 500;
}
.btn-ghost { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
.btn-solid { background: var(--primary); color: #fff; border: none; }
.price-display {
  padding: 11px 14px;
  background: #FFF8E1;
  border-radius: 10px;
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
}
.fab {
  display: none;
  position: fixed;
  bottom: calc(var(--tab-h) + 16px);
  right: 16px;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 28px;
  border: none;
  box-shadow: 0 4px 12px rgba(0,0,0,.25);
  cursor: pointer;
  z-index: 50;
  line-height: 52px;
  text-align: center;
}
.toast {
  position: fixed;
  bottom: calc(var(--tab-h) + 80px);
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.75);
  color: #fff;
  padding: 9px 20px;
  border-radius: 20px;
  font-size: 14px;
  z-index: 200;
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; }
.badge {
  display: inline-block;
  background: var(--primary-light);
  color: var(--primary);
  border-radius: 6px;
  padding: 2px 8px;
  font-size: 12px;
  font-weight: 600;
}
/* 产品库样式 */
.cat-group { border-bottom: 2px solid var(--primary-light); }
.cat-header {
  padding: 12px 16px;
  background: var(--primary-light);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.cat-name { font-weight: 700; color: var(--primary); font-size: 15px; }
.cat-count { font-size: 12px; color: var(--text2); }
.series-header {
  padding: 8px 16px 4px 28px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  background: #FAFAFA;
  border-top: 1px solid var(--border);
}
.model-row {
  display: flex;
  align-items: center;
  padding: 10px 16px 10px 36px;
  border-top: 1px solid var(--border);
  gap: 8px;
}
.model-name { flex: 1; font-size: 14px; }
.model-price { color: var(--accent); font-weight: 700; font-size: 14px; }
.model-del {
  background: var(--danger);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 12px;
  cursor: pointer;
}
/* 批量添加产品 */
.series-block {
  background: #F5F7FA;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
  border: 1px solid var(--border);
}
.series-block-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.series-block-title { font-size: 14px; font-weight: 600; color: var(--primary); }
.series-block-del { background: none; border: none; color: var(--danger); font-size: 20px; cursor: pointer; }
.series-name-input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 14px;
  margin-bottom: 8px;
}
.model-input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 6px;
  align-items: center;
}
.model-input-row input { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.model-input-row .mi-name { flex: 1; }
.model-input-row .mi-price { width: 80px; }
.model-input-row .mi-del { background: none; border: none; color: #ccc; font-size: 20px; cursor: pointer; }
.add-model-btn {
  width: 100%;
  padding: 6px;
  border: 1px dashed var(--primary);
  background: none;
  color: var(--primary);
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  margin-top: 4px;
}
/* 历史 */
.hist-item { border-bottom: 1px solid var(--border); }
.hist-header {
  padding: 14px 16px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.hist-date { font-weight: 600; font-size: 15px; }
.hist-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
.hist-total { font-size: 18px; font-weight: 700; color: var(--accent); }
.hist-detail {
  display: none;
  background: #FAFAFA;
  padding: 12px 16px;
  font-size: 13px;
  line-height: 2;
}
.hist-detail-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--border); }
.hist-detail-item:last-child { border: none; }
.hist-del-btn {
  background: var(--danger);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 5px 14px;
  font-size: 12px;
  cursor: pointer;
  margin-top: 8px;
}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">计件记录</div>
    <div class="header-date" id="headerDate"></div>
  </div>
  <div class="header-total" id="headerTotal"></div>
</div>

<div class="main">
  <!-- 每日记录 -->
  <div class="page active" id="page0">
    <div class="summary-bar">
      <div>
        <div class="label">今日提成</div>
        <div class="value" id="todayTotal">¥0.00</div>
      </div>
      <div style="font-size:40px">💰</div>
    </div>
    <div class="card">
      <div class="card-header">
        <h3>今日记录</h3>
        <span class="badge" id="badge0"></span>
      </div>
      <div id="recordList"><div class="empty-tip">暂无记录，点下方添加</div></div>
      <div style="padding:12px;border-top:1px solid var(--border)">
        <button class="add-btn" onclick="openAddRecord()">+ 添加记录</button>
      </div>
      <div class="save-row" id="saveRow" style="display:none">
        <button class="btn btn-primary" onclick="saveToday()">💾 保存今日记录</button>
      </div>
    </div>
  </div>

  <!-- 产品库 -->
  <div class="page" id="page1">
    <div class="card">
      <div class="card-header">
        <h3>产品库</h3>
        <span class="badge" id="prodCount">0</span>
      </div>
      <div id="prodList"><div class="empty-tip">暂无产品，点右下角 + 添加</div></div>
    </div>
  </div>

  <!-- 售后 -->
  <div class="page" id="page2">
    <div class="summary-bar">
      <div>
        <div class="label">今日售后</div>
        <div class="value" id="afterCount">0 条</div>
      </div>
      <div style="font-size:40px">🔧</div>
    </div>
    <div class="card">
      <div class="card-header">
        <h3>售后记录</h3>
        <span class="badge" id="badge3"></span>
      </div>
      <div id="afterList"><div class="empty-tip">暂无售后记录，点下方添加</div></div>
      <div style="padding:12px;border-top:1px solid var(--border)">
        <button class="add-btn" onclick="openAfterModal()">+ 添加售后</button>
      </div>
    </div>
  </div>

  <!-- 历史 -->
  <div class="page" id="page3">
    <div class="card">
      <div class="card-header">
        <h3>月度统计</h3>
        <span class="badge" id="histCount">0 月</span>
      </div>
      <div id="histList"><div class="empty-tip">暂无历史记录</div></div>
    </div>
  </div>
</div>

<!-- FAB 按钮（产品库页面） -->
<button class="fab" id="fabBtn" onclick="openProdModal()">+</button>

<!-- Tab 栏 -->
<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab(0)">
    <span class="tab-icon">📋</span>
    <span>每日</span>
  </button>
  <button class="tab-btn" onclick="switchTab(1)">
    <span class="tab-icon">📦</span>
    <span>产品</span>
  </button>
  <button class="tab-btn" onclick="switchTab(2)">
    <span class="tab-icon">🔧</span>
    <span>售后</span>
  </button>
  <button class="tab-btn" onclick="switchTab(3)">
    <span class="tab-icon">📅</span>
    <span>历史</span>
  </button>
</div>

<!-- 添加记录 Modal -->
<div class="modal-overlay" id="addRecordModal">
  <div class="modal">
    <h3>添加记录</h3>
    <div class="form-group">
      <label>类别 *</label>
      <div class="select-wrap">
        <select id="selCat" onchange="onCatChange()">
          <option value="">-- 请选择 --</option>
        </select>
      </div>
    </div>
    <div class="form-group" id="grpSeries" style="display:none">
      <label>系列 *</label>
      <div class="select-wrap">
        <select id="selSeries" onchange="onSeriesChange()">
          <option value="">-- 请选择 --</option>
        </select>
      </div>
    </div>
    <div class="form-group" id="grpModel" style="display:none">
      <label>型号 *</label>
      <div class="select-wrap">
        <select id="selModel" onchange="onModelChange()">
          <option value="">-- 请选择 --</option>
        </select>
      </div>
    </div>
    <div class="form-group" id="grpPrice" style="display:none">
      <label>提成单价</label>
      <div class="price-display" id="priceDisplay">--</div>
    </div>
    <div class="form-group">
      <label>客户姓名</label>
      <input type="text" id="inpCustomer" placeholder="选填">
    </div>
    <div class="form-group">
      <label>安装地点</label>
      <input type="text" id="inpLocation" placeholder="选填">
    </div>
    <div class="form-group">
      <label>数量 *</label>
      <input type="number" id="inpQty" min="1" value="1">
    </div>
    <div class="modal-btns">
      <button class="btn-ghost" onclick="closeAddRecord()">取消</button>
      <button class="btn-solid" onclick="confirmAddRecord()">添加</button>
    </div>
  </div>
</div>

<!-- 批量添加产品 Modal -->
<div class="modal-overlay" id="prodModal">
  <div class="modal">
    <h3>批量添加产品</h3>
    <div class="form-group">
      <label>类别名称 *</label>
      <input type="text" id="prodCatInput" placeholder="例：空调、热水器">
    </div>
    <div id="seriesContainer"></div>
    <button class="add-btn" onclick="addSeriesBlock()" style="margin-bottom:12px">+ 添加系列</button>
    <div class="modal-btns">
      <button class="btn-ghost" onclick="closeProdModal()">取消</button>
      <button class="btn-solid" onclick="saveProducts()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 售后 Modal -->
<div class="modal-overlay" id="afterModal">
  <div class="modal">
    <h3>添加售后记录</h3>
    <div class="form-group">
      <label>客户名称 *</label>
      <input type="text" id="afterCustomer" placeholder="请输入客户姓名">
    </div>
    <div class="form-group">
      <label>原因 *</label>
      <textarea id="afterReason" placeholder="请描述售后原因" style="width:100%;border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:15px;height:80px;resize:none"></textarea>
    </div>
    <div class="form-group">
      <label>结果 *</label>
      <textarea id="afterResult" placeholder="请描述处理结果" style="width:100%;border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:15px;height:80px;resize:none"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn-ghost" onclick="closeAfterModal()">取消</button>
      <button class="btn-solid" onclick="confirmAfterRecord()">添加</button>
    </div>
  </div>
</div>

<script>
// ─── 存储 ───────────────────────────────────────────────
var KEY_PRODS = 'pw_prods';
var KEY_DRAFT = 'pw_draft';
var KEY_HIST  = 'pw_hist';
var KEY_AFTER = 'pw_after';

function getProds() {
  return JSON.parse(localStorage.getItem(KEY_PRODS) || '[]');
}
function setProds(v) {
  localStorage.setItem(KEY_PRODS, JSON.stringify(v));
}
function getDraft() {
  return JSON.parse(localStorage.getItem(KEY_DRAFT) || '[]');
}
function setDraft(v) {
  localStorage.setItem(KEY_DRAFT, JSON.stringify(v));
}
function getHist() {
  return JSON.parse(localStorage.getItem(KEY_HIST) || '{}');
}
function setHist(v) {
  localStorage.setItem(KEY_HIST, JSON.stringify(v));
}
function getAfter() {
  return JSON.parse(localStorage.getItem(KEY_AFTER) || '[]');
}
function setAfter(v) {
  localStorage.setItem(KEY_AFTER, JSON.stringify(v));
}

// ─── 工具 ───────────────────────────────────────────────
function todayKey() {
  var d = new Date();
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}
function fmtDate(k) {
  var p = k.split('-');
  return p[0] + '年' + p[1] + '月' + p[2] + '日';
}
function fmtMoney(n) {
  return '¥' + Number(n).toFixed(2);
}
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2200);
}
function unique(arr) {
  return arr.filter(function(v, i, a) { return a.indexOf(v) === i; });
}

// ─── Tab 切换 ────────────────────────────────────────────
function switchTab(i) {
  document.querySelectorAll('.tab-btn').forEach(function(b, j) {
    b.classList.toggle('active', i === j);
  });
  document.querySelectorAll('.page').forEach(function(p, j) {
    p.classList.toggle('active', i === j);
  });
  document.getElementById('fabBtn').style.display = (i === 1) ? 'block' : 'none';
  if (i === 0) renderRecordList();
  if (i === 1) renderProducts();
  if (i === 2) renderAfterList();
  if (i === 3) renderHistory();
}

// ─── 每日记录 ────────────────────────────────────────────
function renderRecordList() {
  var draft = getDraft();
  var list = document.getElementById('recordList');
  var saveRow = document.getElementById('saveRow');
  var badge = document.getElementById('badge0');
  badge.textContent = fmtDate(todayKey()).replace(/^\d{4}年/, '');

  if (!draft.length) {
    list.innerHTML = '<div class="empty-tip">暂无记录，点下方添加</div>';
    saveRow.style.display = 'none';
    updateHeaderTotal(0);
    return;
  }

  var prods = getProds();
  var total = 0;
  var html = '';
  draft.forEach(function(item, idx) {
    var pr = prods.find(function(p) { return p.id === item.prodId; });
    if (!pr) return;
    var sub = item.qty * pr.price;
    total += sub;
    var label = [pr.cat, pr.s, pr.m].filter(Boolean).join(' · ');
    var meta = '¥' + pr.price + '/件';
    if (item.customer) meta += ' · 客户：' + item.customer;
    if (item.location) meta += ' · 地点：' + item.location;
    html += '<div class="record-item">'
      + '<div class="record-info">'
      + '<div class="record-title">' + label + '</div>'
      + '<div class="record-meta">' + meta + '</div>'
      + '</div>'
      + '<div class="record-amount">' + fmtMoney(sub)
      + '<div class="record-qty">× ' + item.qty + '</div>'
      + '</div>'
      + '<button class="delete-btn" onclick="deleteRecord(' + idx + ')">×</button>'
      + '</div>';
  });
  list.innerHTML = html;
  saveRow.style.display = 'block';
  updateHeaderTotal(total);
  document.getElementById('todayTotal').textContent = fmtMoney(total);
}

function updateHeaderTotal(total) {
  document.getElementById('headerTotal').textContent = total > 0 ? fmtMoney(total) : '';
  document.getElementById('todayTotal').textContent = fmtMoney(total);
}

function deleteRecord(idx) {
  var draft = getDraft();
  draft.splice(idx, 1);
  setDraft(draft);
  renderRecordList();
}

function saveToday() {
  var draft = getDraft();
  if (!draft.length) { showToast('没有记录可保存'); return; }
  var prods = getProds();
  var total = draft.reduce(function(s, item) {
    var pr = prods.find(function(p) { return p.id === item.prodId; });
    return s + (pr ? item.qty * pr.price : 0);
  }, 0);
  var hist = getHist();
  var key = todayKey();
  hist[key] = { items: draft, total: total, pieces: draft.length, savedAt: new Date().toISOString() };
  setHist(hist);
  setDraft([]);
  renderRecordList();
  showToast('已保存 ' + fmtMoney(total));
}

// ─── 添加记录 Modal ──────────────────────────────────────
function openAddRecord() {
  var prods = getProds();
  if (!prods.length) { showToast('请先在产品库添加产品'); return; }
  var cats = unique(prods.map(function(p) { return p.cat; }));
  var sel = document.getElementById('selCat');
  sel.innerHTML = '<option value="">-- 请选择 --</option>'
    + cats.map(function(c) { return '<option value="' + c + '">' + c + '</option>'; }).join('');
  document.getElementById('grpSeries').style.display = 'none';
  document.getElementById('grpModel').style.display = 'none';
  document.getElementById('grpPrice').style.display = 'none';
  document.getElementById('inpCustomer').value = '';
  document.getElementById('inpLocation').value = '';
  document.getElementById('inpQty').value = '1';
  document.getElementById('addRecordModal').classList.add('open');
}
function closeAddRecord() {
  document.getElementById('addRecordModal').classList.remove('open');
}

function onCatChange() {
  var cat = document.getElementById('selCat').value;
  var prods = getProds();
  document.getElementById('grpSeries').style.display = 'none';
  document.getElementById('grpModel').style.display = 'none';
  document.getElementById('grpPrice').style.display = 'none';
  if (!cat) return;
  var filtered = prods.filter(function(p) { return p.cat === cat; });
  var series = unique(filtered.map(function(p) { return p.s; }).filter(Boolean));
  if (series.length > 0) {
    var sel = document.getElementById('selSeries');
    sel.innerHTML = '<option value="">-- 请选择 --</option>'
      + series.map(function(s) { return '<option value="' + s + '">' + s + '</option>'; }).join('');
    document.getElementById('grpSeries').style.display = 'block';
  } else {
    fillModels(cat, '');
  }
}

function onSeriesChange() {
  var cat = document.getElementById('selCat').value;
  var series = document.getElementById('selSeries').value;
  document.getElementById('grpModel').style.display = 'none';
  document.getElementById('grpPrice').style.display = 'none';
  if (!series) return;
  fillModels(cat, series);
}

function fillModels(cat, series) {
  var prods = getProds();
  var filtered = prods.filter(function(p) {
    return p.cat === cat && (series === '' || p.s === series);
  });
  var models = unique(filtered.map(function(p) { return p.m; }).filter(Boolean));
  if (models.length > 0) {
    var sel = document.getElementById('selModel');
    sel.innerHTML = '<option value="">-- 请选择 --</option>'
      + models.map(function(m) { return '<option value="' + m + '">' + m + '</option>'; }).join('');
    document.getElementById('grpModel').style.display = 'block';
  } else {
    showSelectedPrice(cat, series, '');
  }
}

function onModelChange() {
  var cat = document.getElementById('selCat').value;
  var series = document.getElementById('selSeries').value;
  var model = document.getElementById('selModel').value;
  document.getElementById('grpPrice').style.display = 'none';
  if (!model) return;
  showSelectedPrice(cat, series, model);
}

function showSelectedPrice(cat, series, model) {
  var prods = getProds();
  var pr = prods.find(function(p) {
    return p.cat === cat
      && (series === '' || p.s === series)
      && (model === '' || p.m === model);
  });
  if (pr) {
    document.getElementById('priceDisplay').textContent = fmtMoney(pr.price) + ' / 件';
    document.getElementById('grpPrice').style.display = 'block';
  }
}

function confirmAddRecord() {
  var cat    = document.getElementById('selCat').value;
  var series = document.getElementById('selSeries').value;
  var model  = document.getElementById('selModel').value;
  var qty    = parseInt(document.getElementById('inpQty').value, 10);
  var cust   = document.getElementById('inpCustomer').value.trim();
  var loc    = document.getElementById('inpLocation').value.trim();

  if (!cat) { showToast('请选择类别'); return; }
  if (!qty || qty < 1) { showToast('请填写数量'); return; }

  var prods = getProds();
  var pr = prods.find(function(p) {
    return p.cat === cat
      && (series === '' || p.s === series)
      && (model === '' || p.m === model);
  });
  if (!pr) { showToast('未找到对应产品，请完整选择'); return; }

  var draft = getDraft();
  draft.push({ prodId: pr.id, qty: qty, customer: cust, location: loc });
  setDraft(draft);
  closeAddRecord();
  renderRecordList();
  showToast('已添加');
}

// ─── 产品库 ──────────────────────────────────────────────
function renderProducts() {
  var prods = getProds();
  document.getElementById('prodCount').textContent = prods.length;
  var list = document.getElementById('prodList');
  if (!prods.length) {
    list.innerHTML = '<div class="empty-tip">暂无产品，点右下角 + 添加</div>';
    return;
  }
  // 按 类别 → 系列 分组
  var catMap = {};
  prods.forEach(function(p, i) {
    if (!catMap[p.cat]) catMap[p.cat] = {};
    var s = p.s || '__none__';
    if (!catMap[p.cat][s]) catMap[p.cat][s] = [];
    catMap[p.cat][s].push({ prod: p, idx: i });
  });

  var html = '';
  Object.keys(catMap).forEach(function(cat) {
    var seriesMap = catMap[cat];
    var total = Object.values(seriesMap).reduce(function(s, a) { return s + a.length; }, 0);
    var catId = 'cat_' + encodeURIComponent(cat);
    html += '<div class="cat-group">'
      + '<div class="cat-header" onclick="toggleCat(\'' + catId + '\')">'
      + '<span class="cat-name">' + cat + '</span>'
      + '<span class="cat-count">' + total + ' 个型号 ▾</span>'
      + '</div>'
      + '<div id="' + catId + '" style="display:none">';
    Object.keys(seriesMap).forEach(function(s) {
      var items = seriesMap[s];
      if (s !== '__none__') {
        html += '<div class="series-header">' + s + '</div>';
      }
      items.forEach(function(entry) {
        html += '<div class="model-row">'
          + '<span class="model-name">' + entry.prod.m + '</span>'
          + '<span class="model-price">¥' + entry.prod.price + '</span>'
          + '<button class="model-del" onclick="deleteProduct(' + entry.idx + ')">删除</button>'
          + '</div>';
      });
    });
    html += '</div></div>';
  });
  list.innerHTML = html;
}

function toggleCat(id) {
  var el = document.getElementById(id);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function deleteProduct(idx) {
  if (!confirm('确认删除该产品？')) return;
  var prods = getProds();
  prods.splice(idx, 1);
  setProds(prods);
  renderProducts();
  showToast('已删除');
}

// ─── 批量添加产品 Modal ──────────────────────────────────
var seriesBlockCount = 0;

function openProdModal() {
  document.getElementById('prodCatInput').value = '';
  document.getElementById('seriesContainer').innerHTML = '';
  seriesBlockCount = 0;
  addSeriesBlock();
  document.getElementById('prodModal').classList.add('open');
}
function closeProdModal() {
  document.getElementById('prodModal').classList.remove('open');
}

function addSeriesBlock() {
  seriesBlockCount++;
  var n = seriesBlockCount;
  var blockId = 'sb_' + n;
  var div = document.createElement('div');
  div.className = 'series-block';
  div.id = blockId;
  div.innerHTML = '<div class="series-block-header">'
    + '<span class="series-block-title">系列 ' + n + '</span>'
    + '<button class="series-block-del" onclick="document.getElementById(\'' + blockId + '\').remove()">×</button>'
    + '</div>'
    + '<input type="text" class="series-name-input" placeholder="系列名称（选填）">'
    + '<div class="model-inputs">'
    + buildModelInputRow()
    + '</div>'
    + '<button class="add-model-btn" onclick="addModelRow(\'' + blockId + '\')">+ 添加型号</button>';
  document.getElementById('seriesContainer').appendChild(div);
}

function buildModelInputRow() {
  return '<div class="model-input-row">'
    + '<input type="text" class="mi-name" placeholder="型号名称">'
    + '<input type="number" class="mi-price" placeholder="提成" step="0.01" min="0">'
    + '<button class="mi-del" onclick="this.parentElement.remove()">×</button>'
    + '</div>';
}

function addModelRow(blockId) {
  var block = document.getElementById(blockId);
  var container = block.querySelector('.model-inputs');
  var div = document.createElement('div');
  div.innerHTML = buildModelInputRow();
  container.appendChild(div.firstChild);
}

function saveProducts() {
  var cat = document.getElementById('prodCatInput').value.trim();
  if (!cat) { showToast('请填写类别名称'); return; }

  var blocks = document.querySelectorAll('#seriesContainer .series-block');
  if (!blocks.length) { showToast('请至少添加一个系列'); return; }

  var newProds = [];
  var hasValid = false;

  blocks.forEach(function(block) {
    var seriesName = block.querySelector('.series-name-input').value.trim();
    var rows = block.querySelectorAll('.model-input-row');
    rows.forEach(function(row) {
      var mName = row.querySelector('.mi-name').value.trim();
      var mPrice = parseFloat(row.querySelector('.mi-price').value);
      if (mName && !isNaN(mPrice) && mPrice > 0) {
        hasValid = true;
        newProds.push({
          id: Date.now() + '_' + Math.random(),
          cat: cat,
          s: seriesName,
          m: mName,
          price: mPrice
        });
      }
    });
  });

  if (!hasValid) { showToast('请至少填写一个型号和提成'); return; }

  var prods = getProds();
  prods = prods.concat(newProds);
  setProds(prods);
  closeProdModal();
  renderProducts();
  showToast('已添加 ' + newProds.length + ' 个产品');
}

// ─── 售后 ────────────────────────────────────────────────
function renderAfterList() {
  var list = getAfter();
  var el = document.getElementById('afterList');
  var badge = document.getElementById('badge3');
  var today = todayKey();
  var todayItems = list.filter(function(r) { return r.date === today; });
  document.getElementById('afterCount').textContent = todayItems.length + ' 条';
  if (badge) badge.textContent = fmtDate(today).replace(/^\d{4}年/, '');
  if (!list.length) {
    el.innerHTML = '<div class="empty-tip">暂无售后记录，点下方添加</div>';
    return;
  }
  var html = '';
  list.slice().reverse().forEach(function(item, idx) {
    var realIdx = list.length - 1 - idx;
    html += '<div class="record-item">'
      + '<div class="record-info">'
      + '<div class="record-title">' + item.customer + '</div>'
      + '<div class="record-meta">'
      + '<span style="color:#1976D2">原因：</span>' + item.reason + '<br>'
      + '<span style="color:#4CAF50">结果：</span>' + item.result + '<br>'
      + '<span style="color:#aaa;font-size:11px">' + fmtDate(item.date) + '</span>'
      + '</div>'
      + '</div>'
      + '<button class="delete-btn" onclick="deleteAfter(' + realIdx + ')">×</button>'
      + '</div>';
  });
  el.innerHTML = html;
}

function openAfterModal() {
  document.getElementById('afterCustomer').value = '';
  document.getElementById('afterReason').value = '';
  document.getElementById('afterResult').value = '';
  document.getElementById('afterModal').classList.add('open');
}
function closeAfterModal() {
  document.getElementById('afterModal').classList.remove('open');
}
function confirmAfterRecord() {
  var customer = document.getElementById('afterCustomer').value.trim();
  var reason   = document.getElementById('afterReason').value.trim();
  var result   = document.getElementById('afterResult').value.trim();
  if (!customer) { showToast('请填写客户名称'); return; }
  if (!reason)   { showToast('请填写原因'); return; }
  if (!result)   { showToast('请填写结果'); return; }
  var list = getAfter();
  list.push({ customer: customer, reason: reason, result: result, date: todayKey() });
  setAfter(list);
  closeAfterModal();
  renderAfterList();
  showToast('已添加');
}
function deleteAfter(idx) {
  if (!confirm('确认删除该售后记录？')) return;
  var list = getAfter();
  list.splice(idx, 1);
  setAfter(list);
  renderAfterList();
  showToast('已删除');
}

// ─── 月度统计 ─────────────────────────────────────────────
function renderHistory() {
  var hist = getHist();
  var prods = getProds();
  var dayKeys = Object.keys(hist).sort(function(a, b) { return b.localeCompare(a); });
  var list = document.getElementById('histList');

  if (!dayKeys.length) {
    document.getElementById('histCount').textContent = '0 月';
    list.innerHTML = '<div class="empty-tip">暂无历史记录<br>保存每日记录后在此查看</div>';
    return;
  }

  // 按月份分组：monthMap[YYYY-MM] = { total, days, customerMap }
  // customerMap[客户名] = { total, items:[] }
  var monthMap = {};
  dayKeys.forEach(function(dayKey) {
    var rec = hist[dayKey];
    var month = dayKey.substring(0, 7); // YYYY-MM
    if (!monthMap[month]) monthMap[month] = { total: 0, days: 0, customerMap: {} };
    var mo = monthMap[month];
    mo.days++;
    if (rec.items && rec.items.length) {
      rec.items.forEach(function(item) {
        var pr = prods.find(function(p) { return p.id === item.prodId; });
        var sub = pr ? item.qty * pr.price : 0;
        mo.total += sub;
        var custName = item.customer || '（未填客户）';
        if (!mo.customerMap[custName]) mo.customerMap[custName] = { total: 0, items: [] };
        mo.customerMap[custName].total += sub;
        mo.customerMap[custName].items.push({
          date: dayKey,
          label: pr ? [pr.cat, pr.s, pr.m].filter(Boolean).join(' · ') : '已删除产品',
          qty: item.qty,
          sub: sub
        });
      });
    }
  });

  var months = Object.keys(monthMap).sort(function(a, b) { return b.localeCompare(a); });
  document.getElementById('histCount').textContent = months.length + ' 月';

  var html = '';
  months.forEach(function(month) {
    var mo = monthMap[month];
    var p = month.split('-');
    var monthLabel = p[0] + '年' + p[1] + '月';
    var monthId = 'mo_' + month;
    var custNames = Object.keys(mo.customerMap).sort();

    // 客户列表
    var custHtml = '';
    custNames.forEach(function(name) {
      var cust = mo.customerMap[name];
      var custId = 'cu_' + month + '_' + encodeURIComponent(name);
      var rowsHtml = cust.items.map(function(it) {
        return '<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f0f0f0;font-size:12px">'
          + '<span style="color:#555">' + fmtDate(it.date).replace(/\d{4}年/, '') + '&nbsp;' + it.label + ' ×' + it.qty + '</span>'
          + '<span style="color:#FF6F00">' + fmtMoney(it.sub) + '</span>'
          + '</div>';
      }).join('');

      custHtml += '<div style="border-bottom:1px solid #eee">'
        + '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px 10px 24px;cursor:pointer;background:#fafafa" onclick="toggleHist(\'' + custId + '\')">'
        + '<div style="display:flex;align-items:center;gap:8px">'
        + '<span style="font-size:18px">👤</span>'
        + '<span style="font-weight:600;font-size:14px">' + name + '</span>'
        + '<span style="font-size:12px;color:#999">' + cust.items.length + '条</span>'
        + '</div>'
        + '<span style="color:#FF6F00;font-weight:700">' + fmtMoney(cust.total) + '</span>'
        + '</div>'
        + '<div id="' + custId + '" style="display:none;padding:8px 16px 8px 48px;background:#fff">'
        + rowsHtml
        + '</div>'
        + '</div>';
    });

    html += '<div style="border-bottom:2px solid #E3F2FD;margin-bottom:4px">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#E3F2FD;cursor:pointer" onclick="toggleHist(\'' + monthId + '\')">'
      + '<div>'
      + '<div style="font-weight:700;color:#1976D2;font-size:16px">' + monthLabel + '</div>'
      + '<div style="font-size:12px;color:#757575">共 ' + mo.days + ' 天 · ' + custNames.length + ' 位客户</div>'
      + '</div>'
      + '<div style="font-size:20px;font-weight:700;color:#FF6F00">' + fmtMoney(mo.total) + '</div>'
      + '</div>'
      + '<div id="' + monthId + '" style="display:none">'
      + custHtml
      + '</div>'
      + '</div>';
  });

  list.innerHTML = html;
}

function toggleHist(id) {
  var el = document.getElementById(id);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

// ─── 初始化 ──────────────────────────────────────────────
(function init() {
  var d = new Date();
  document.getElementById('headerDate').textContent =
    (d.getMonth() + 1) + '月' + d.getDate() + '日';
  renderRecordList();
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/piecework-app/sw.js');
}
</script>
