<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>计件工作记录</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--primary:#1976D2;--primary-light:#E3F2FD;--accent:#FF6F00;--danger:#E53935;--bg:#F5F7FA;--card:#fff;--text:#212121;--text2:#757575;--border:#E0E0E0;--radius:12px;--tab-h:56px;--header-h:56px}
body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.main-content{flex:1;overflow:hidden;display:flex;flex-direction:column}
.header{height:var(--header-h);background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.header-date{font-size:13px;opacity:.85}
.header-right{font-size:20px;font-weight:700;color:#FFD54F}
.tab-bar{height:var(--tab-h);background:#fff;display:flex;border-top:1px solid var(--border);flex-shrink:0;box-shadow:0 -2px 8px rgba(0,0,0,.07)}
.tab-btn{flex:1;border:none;background:none;font-size:11px;color:var(--text2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;transition:color .2s}
.tab-btn .tab-icon{font-size:17px}
.tab-btn.active{color:var(--primary)}
.tab-btn.active::after{content:'';position:absolute;top:0;left:10%;right:10%;height:3px;background:var(--primary);border-radius:0 0 3px 3px}
.page{display:none;flex:1;overflow-y:auto;padding:12px}
.page.active{display:block}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:12px;overflow:hidden}
.card-header{padding:12px 16px;background:var(--primary-light);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.card-header h3{font-size:15px;color:var(--primary);font-weight:600}
.summary-bar{background:var(--primary);color:#fff;border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.summary-bar .lbl{font-size:13px;opacity:.85}
.summary-bar .amt{font-size:26px;font-weight:700}
.record-item{display:flex;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--border);gap:8px}
.record-item:last-child{border-bottom:none}
.record-info{flex:1}
.record-title{font-size:15px;font-weight:600}
.record-meta{font-size:12px;color:var(--text2);margin-top:3px;line-height:1.5}
.record-amount{font-size:15px;color:var(--accent);font-weight:700;flex-shrink:0}
.del-btn{background:none;border:none;font-size:20px;color:#ccc;cursor:pointer;padding:4px;flex-shrink:0}
.del-btn:active{color:var(--danger)}
.add-btn{width:100%;padding:12px;border:2px dashed var(--primary);background:var(--primary-light);color:var(--primary);border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer}
.add-btn:active{opacity:.75}
.save-row{padding:12px 16px;background:#fff;border-top:1px solid var(--border)}
.empty-tip{text-align:center;color:var(--text2);padding:32px 16px;font-size:14px}
.btn{border:none;border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer;font-weight:500;transition:opacity .15s}
.btn:active{opacity:.75}
.btn-primary{background:var(--primary);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-full{width:100%;padding:14px;font-size:16px;border-radius:var(--radius)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:20px 20px 32px;animation:slideUp .25s ease;max-height:90vh;overflow-y:auto}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{font-size:17px;font-weight:700;margin-bottom:16px;text-align:center}
.form-group{margin-bottom:14px}
.form-group label{font-size:13px;color:var(--text2);margin-bottom:5px;display:block}
.form-group input,.form-group textarea,.form-group select{width:100%;border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:15px;background:#fff}
.form-group textarea{resize:none;height:80px}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--primary)}
.modal-btns{display:flex;gap:10px;margin-top:18px}
.modal-btns .btn{flex:1;padding:13px;font-size:15px}
.select-wrap{position:relative}
.select-wrap::after{content:'▾';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text2);pointer-events:none}
.history-item{padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.history-date{font-size:15px;font-weight:600}
.history-meta{font-size:13px;color:var(--text2);margin-top:3px}
.history-total{font-size:18px;color:var(--accent);font-weight:700}
.history-row{display:flex;justify-content:space-between;align-items:center}
.history-detail{background:#F5F7FA;padding:10px 16px;display:none}
.history-detail.open{display:block}
.history-detail p{margin:4px 0;font-size:13px}
#fab{display:none;position:fixed;bottom:calc(var(--tab-h)+16px);right:16px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;font-size:28px;border:none;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer;align-items:center;justify-content:center;z-index:50}
#fab:active{transform:scale(.92)}
.toast{position:fixed;bottom:calc(var(--tab-h)+80px);left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:9px 20px;border-radius:20px;font-size:14px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.badge{display:inline-block;background:var(--primary-light);color:var(--primary);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
</style>
</head>
<body>
<div class="header">
<div><div style="font-size:18px;font-weight:600;color:#fff;">📦 计件记录</div><div class="header-date" id="headerDate"></div></div>
<div class="header-right" id="headerRight"></div>
</div>
<div class="main-content">
<div class="page active" id="page0">
<div class="summary-bar"><div><div class="lbl">今日总提成</div><div class="amt" id="todayTotal0">¥0.00</div></div><div style="font-size:36px;">💰</div></div>
<div class="card"><div class="card-header"><h3>今日工作明细</h3><span class="badge" id="badge0"></span></div><div id="list0"><div class="empty-tip">点击下方添加</div></div>
<div style="padding:12px 16px;border-top:1px solid var(--border);"><button class="add-btn" onclick="openM(0)">＋ 添加记录</button></div>
<div class="save-row" id="save0" style="display:none;"><button class="btn btn-primary btn-full" onclick="saveD(0)">💾 保存</button></div></div>
</div>
<div class="page" id="page1">
<div class="summary-bar"><div><div class="lbl">今日售后次数</div><div class="amt" id="todayTotal1">0 次</div></div><div style="font-size:36px;">🔧</div></div>
<div class="card"><div class="card-header"><h3>售后记录</h3><span class="badge" id="badge1"></span></div><div id="list1"><div class="empty-tip">点击下方添加</div></div>
<div style="padding:12px 16px;border-top:1px solid var(--border);"><button class="add-btn" onclick="openM(1)">＋ 添加售后</button></div>
<div class="save-row" id="save1" style="display:none;"><button class="btn btn-primary btn-full" onclick="saveD(1)">💾 保存</button></div></div>
</div>
<div class="page" id="page2">
<div class="summary-bar"><div><div class="lbl">今日报销总额</div><div class="amt" id="todayTotal2">¥0.00</div></div><div style="font-size:36px;">💸</div></div>
<div class="card"><div class="card-header"><h3>报销记录</h3><span class="badge" id="badge2"></span></div><div id="list2"><div class="empty-tip">点击下方添加</div></div>
<div style="padding:12px 16px;border-top:1px solid var(--border);"><button class="add-btn" onclick="openM(2)">＋ 添加报销</button></div>
<div class="save-row" id="save2" style="display:none;"><button class="btn btn-primary btn-full" onclick="saveD(2)">💾 保存</button></div></div>
</div>
<div class="page" id="page3"><div class="card"><div class="card-header"><h3>产品库</h3><span class="badge" id="prodCount">0</span></div><div id="prodList"><div class="empty-tip">暂无，点右下角+</div></div></div></div>
<div class="page" id="page4"><div class="card"><div class="card-header"><h3>历史记录</h3><span class="badge" id="histCount">0天</span></div><div id="histList"><div class="empty-tip">暂无</div></div></div></div>
<button id="fab" onclick="openProdM()">＋</button>
</div>
<div class="tab-bar">
<button class="tab-btn active" onclick="switchTab(0)" id="tab0"><span class="tab-icon">📋</span>每日</button>
<button class="tab-btn" onclick="switchTab(1)" id="tab1"><span class="tab-icon">🔧</span>售后</button>
<button class="tab-btn" onclick="switchTab(2)" id="tab2"><span class="tab-icon">💸</span>报销</button>
<button class="tab-btn" onclick="switchTab(3)" id="tab3"><span class="tab-icon">📦</span>产品</button>
<button class="tab-btn" onclick="switchTab(4)" id="tab4"><span class="tab-icon">📅</span>历史</button>
</div>
<div class="modal-overlay" id="m0"><div class="modal"><h3>添加工作记录</h3>
<div class="form-group"><label>类别*</label><div class="select-wrap"><select id="s0c" onchange="ch0c()"><option value="">--请选类别--</option></select></div></div>
<div class="form-group" id="g0s" style="display:none"><label>系列*</label><div class="select-wrap"><select id="s0s" onchange="ch0s()"><option value="">--请选系列--</option></select></div></div>
<div class="form-group" id="g0m" style="display:none"><label>型号*</label><div class="select-wrap"><select id="s0m" onchange="ch0m()"><option value="">--请选型号--</option></select></div></div>
<div class="form-group" id="g0p" style="display:none"><label>提成</label><div id="p0d" style="padding:11px;background:#f5f7fa;border-radius:10px;font-size:16px;color:var(--accent);font-weight:700"></div></div>
<div class="form-group"><label>客户</label><input type="text" id="i0c" placeholder="选填"></div>
<div class="form-group"><label>地点</label><input type="text" id="i0l" placeholder="选填"></div>
<div class="form-group"><label>数量*</label><input type="number" id="i0q" min="1"></div>
<div class="modal-btns"><button class="btn btn-ghost" onclick="closeM(0)">取消</button><button class="btn btn-primary" onclick="addR(0)">添加</button></div></div></div>
<div class="modal-overlay" id="m1"><div class="modal"><h3>添加售后记录</h3>
<div class="form-group"><label>客户名称*</label><input type="text" id="i1c"></div>
<div class="form-group"><label>地址*</label><input type="text" id="i1a"></div>
<div class="form-group"><label>问题*</label><textarea id="i1p"></textarea></div>
<div class="form-group"><label>处理结果*</label><textarea id="i1r"></textarea></div>
<div class="modal-btns"><button class="btn btn-ghost" onclick="closeM(1)">取消</button><button class="btn btn-primary" onclick="addR(1)">添加</button></div></div></div>
<div class="modal-overlay" id="m2"><div class="modal"><h3>添加报销</h3>
<div class="form-group"><label>费用类别*</label><input type="text" id="i2t"></div>
<div class="form-group"><label>摘要*</label><textarea id="i2d"></textarea></div>
<div class="form-group"><label>金额*</label><input type="number" id="i2a" step="0.01"></div>
<div class="modal-btns"><button class="btn btn-ghost" onclick="closeM(2)">取消</button><button class="btn btn-primary" onclick="addR(2)">添加</button></div></div></div>
<div class="modal-overlay" id="prodM"><div class="modal"><h3>批量添加产品</h3>
<div class="form-group"><label>类别*</label><input type="text" id="pca"></div>
<div id="sl"></div>
<button class="btn btn-ghost btn-full" onclick="addSB()" style="margin-bottom:12px">＋添加系列</button>
<div class="modal-btns"><button class="btn btn-ghost" onclick="closeProdM()">取消</button><button class="btn btn-primary" onclick="saveBP()">保存</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const DB={get p(){return JSON.parse(localP||'[]')},set p(v){localP=JSON.stringify(v)},get d(){return JSON.parse(localD||'{}')},set d(v){localD=JSON.stringify(v)},get h(){return JSON.parse(localH||'{}')},set h(v){localH=JSON.stringify(v)}};
const localP='pw_prods',localD='pw_drafts',localH='pw_hist';
function tk(){const d=new Date();return`${d.getY()}-${String(d.getM()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function fd(k){const[y,m,dt]=k.split('-');return`${y}年${m}月${dt}日`}
function fm(n){return'¥'+Number(n).toFixed(2)}
let ct=0;
function st(i){ct=i;dqA('.tab-btn').forEach((b,j)=>b.classList.toggle('active',i===j));dqA('.page').forEach((p,j)=>p.classList.toggle('active',i===j));fab.style.display=i===3?'':'none';[0,1,2].forEach(j=>{if(i===j)rl(j);else hdR.innerHTML=''});if(i===3)rp();if(i===4)rh()}
function rl(t){const d=getD(t),l=dq('list'+t),s=dq('save'+t),b=dq('badge'+t);if(b)b.innerHTML=fd(tk()).replace(/\d{4}年/,'');if(!d.length){l.innerHTML='<div class="empty-tip">点击下方添加</div>';s.style.display='none';upS(t,0);return}let html='',total=0;d.forEach((item,idx)=>{if(t===0){const pr=DB.p.find(x=>x.id===item.pid);if(!pr)return;const sub=item.q*pr.price;total+=sub;const sm=[pr.s,pr.m].filter(Boolean).join('·');html+=`<div class="record-item"><div class="record-info"><div class="record-title">${pr.cat}</div><div class="record-meta">${sm}·¥${pr.price}/件<br>${item.c?'👤'+item.c:''} ${item.l?'📍'+item.l:''}</div></div><div class="record-amount">${fm(sub)}<div style="font-size:12px;color:var(--text2)">×${item.q}</div></div><button class="del-btn" onclick="rm(${t},${idx})">✕</button></div>`}else if(t===1){total+=1;html+=`<div class="record-item"><div class="record-info"><div class="record-title">${item.c}</div><div class="record-meta">📍${item.a}<br>📝${item.p.substring(0,20)}<br>✅${item.r.substring(0,20)}</div></div><button class="del-btn" onclick="rm(${t},${idx})">✕</button></div>`}else if(t===2){total+=item.am;html+=`<div class="record-item"><div class="record-info"><div class="record-title">${item.t}</div><div class="record-meta">${item.d}</div></div><div class="record-amount">${fm(item.am)}</div><button class="del-btn" onclick="rm(${t},${idx})">✕</button></div>`}});l.innerHTML=html;s.style.display='block';upS(t,total)}
function upS(t,total){if(t===0){dq('todayTotal0').innerHTML=fm(total);hdR.innerHTML=total>0?fm(total):''}else if(t===1){dq('todayTotal1').innerHTML=total+'次';hdR.innerHTML=total>0?total+'次售后':''}else if(t===2){dq('todayTotal2').innerHTML=fm(total);hdR.innerHTML=total>0?fm(total):''}}
function getD(t){const d=DB.d;if(!d[tk()])d[tk()]={0:[],1:[],2:[]};return d[tk()][t]}
function setD(t,v){const d=DB.d;if(!d[tk()])d[tk()]={0:[],1:[],2:[]};d[tk()][t]=v;DB.d=d}
function rm(t,idx){const d=getD(t);d.splice(idx,1);setD(t,d);rl(t)}
function saveD(t){const d=getD(t);if(!d.length){sh('请先添加记录');return}const k=tk(),h=DB.h;if(!h[k])h[k]={0:{i:[],t:0},1:{i:[],t:0},2:{i:[],t:0}};h[k][t]={i:d,t:d.reduce((s,x)=>s+(t===0?x.q*(DB.p.find(p=>p.id===x.pid)||{}).price:t===2?x.am:1),0)};DB.h=h;setD(t,[]);rl(t);sh('✅已保存')}
function openM(t){if(t===0){const ps=DB.p;if(!ps.length){sh('请先添加产品');return}const cats=[...new Set(ps.map(p=>p.cat))];dq('s0c').innerHTML='<option value="">--请选类别--'+cats.map(c=>`<option value="${c}">${c}</option>`).join('');['g0s','g0m','g0p'].forEach(id=>dq(id).style.display='none');dq('i0q').value='';dq('i0c').value='';dq('i0l').value=''}else if(t===1){['i1c','i1a','i1p','i1r'].forEach(id=>dq(id).value='')}else if(t===2){['i2t','i2d','i2a'].forEach(id=>dq(id).value='')}dq('m'+t).classList.add('open')}
function closeM(t){dq('m'+t).classList.remove('open')}
function addR(t){const d=getD(t);if(t===0){const cat=dq('s0c').value,series=dq('s0s').value,model=dq('s0m').value,qty=parseInt(dq('i0q').value),c=dq('i0c').value.trim(),l=dq('i0l').value.trim();if(!cat||!qty||qty<=0){sh('请填写完整');return}const pr=DB.p.find(p=>p.cat===cat&&(series?p.s===series:true)&&(model?p.m===model:true));if(!pr){sh('请完整选择');return}d.push({pid:pr.id,q:qty,c:c,l:l})}else if(t===1){const c=dq('i1c').value.trim(),a=dq('i1a').value.trim(),p=dq('i1p').value.trim(),r=dq('i1r').value.trim();if(!c||!a||!p||!r){sh('请填写完整');return}d.push({c:c,a:a,p:p,r:r})}else if(t===2){const t2=dq('i2t').value.trim(),d2=dq('i2d').value.trim(),am=parseFloat(dq('i2a').value);if(!t2||!d2||!am||am<=0){sh('请填写完整');return}d.push({t:t2,d:d2,am:am})}setD(t,d);closeM(t);rl(t);sh('✅已添加')}
function ch0c(){const cat=dq('s0c').value,ps=DB.p;['g0s','g0m','g0p'].forEach(id=>dq(id).style.display='none');if(!cat)return;const ss=[...new Set(ps.filter(p=>p.cat===cat).map(p=>p.s).filter(Boolean)];if(ss.length){dq('s0s').innerHTML='<option value="">--请选系列--'+ss.map(s=>`<option value="${s}">${s}</option>`).join('');dq('g0s').style.display='block'}else{fm0(cat,'')}}
function ch0s(){const cat=dq('s0c').value,series=dq('s0s').value;if(!series)return;fm0(cat,series)}
function fm0(cat,series){const ps=DB.p;const ms=[...new Set(ps.filter(p=>p.cat===cat&&(series===''?true:p.s===series)).map(p=>p.m).filter(Boolean))];if(ms.length){dq('s0m').innerHTML='<option value="">--请选型号--'+ms.map(m=>`<option value="${m}">${m}</option>`).join('');dq('g0m').style.display='block'}else{sh0(cat,series,'')}}
function ch0m(){const cat=dq('s0c').value,series=dq('s0s').value,model=dq('s0m').value;if(!model){dq('g0p').style.display='none';return}sh0(cat,series,model)}
function sh0(cat,series,model){const pr=DB.p.find(p=>p.cat===cat&&(series?p.s===series:true)&&(model?p.m===model:true));if(pr){dq('p0d').innerHTML='¥'+pr.price+'/件';dq('g0p').style.display='block'}}
let sc=0;
function openProdM(){dq('pca').value='';dq('sl').innerHTML='';sc=0;addSB();dq('prodM').classList.add('open')}
function closeProdM(){dq('prodM').classList.remove('open')}
function addSB(){sc++;const id='s'+sc;dq('sl').insertAdjacentHTML('beforeend',`<div style="background:#f5f7fa;border-radius:10px;padding:12px;margin-bottom:10px" id="${id}"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><label style="font-size:14px;font-weight:600;color:var(--primary)">系列${sc}</label><button onclick="dq('${id}').remove()" style="background:none;border:none;color:var(--danger);font-size:18px;cursor:pointer">✕</button></div><input type="text" class="sname" placeholder="系列名" style="width:100%;padding:8px;font-size:14px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px"><div class="ml"><div style="display:flex;gap:8px;margin-bottom:6px"><input type="text" placeholder="型号" class="mname" style="flex:1;padding:8px;font-size:14px;border:1px solid var(--border);border-radius:8px"><input type="number" placeholder="提成" class="pval" style="width:70px;padding:8px;font-size:14px;border:1px solid var(--border);border-radius:8px" step="0.01"><button onclick="this.parentElement.remove()" style="background:none;border:none;color:#ccc;font-size:18px;cursor:pointer">✕</button></div></div><button onclick="addMI('${id}')" style="background:none;border:1px dashed var(--primary);color:var(--primary);border-radius:6px;padding:6px;font-size:12px;width:100%;margin-top:6px">＋型号</button></div>`)}
function addMI(sid){const el=dq(sid).querySelector('.ml');el.insertAdjacentHTML('beforeend',`<div style="display:flex;gap:8px;margin-bottom:6px"><input type="text" placeholder="型号" class="mname" style="flex:1;padding:8px;font-size:14px;border:1px solid var(--border);border-radius:8px"><input type="number" placeholder="提成" class="pval" style="width:70px;padding:8px;font-size:14px;border:1px solid var(--border);border-radius:8px" step="0.01"><button onclick="this.parentElement.remove()" style="background:none;border:none;color:#ccc;font-size:18px;cursor:pointer">✕</button></div>`)}
function saveBP(){const cat=dq('pca').value.trim();if(!cat){sh('请填类别');return}const blks=dqA('#sl>div');if(!blks.length){sh('请加系列');return}let np=[],hv=false;blks.forEach(b=>{const sn=b.querySelector('.sname').value.trim();const ms=b.querySelectorAll('.ml>div');ms.forEach(m=>{const mn=m.querySelector('.mname').value.trim(),pv=parseFloat(m.querySelector('.pval').value);if(mn&&!isNaN(pv)&&pv>0){hv=true;np.push({id:Date.now()+Math.random(),cat:cat,s:sn,m:mn,price:pv})}})});if(!hv){sh('请填型号和提成');return}const ps=DB.p;ps.push(...np);DB.p=ps;closeProdM();rp();sh('✅已添加'+np.length+'个')}
function rp(){const ps=DB.p;dq('prodCount').innerHTML=ps.length;const l=dq('prodList');if(!ps.length){l.innerHTML='<div class="empty-tip">暂无，点右下角+</div>';return}const cm={};ps.forEach((p,i)=>{if(!cm[p.cat])cm[p.cat]={};const s=p.s||'__';if(!cm[p.cat][s])cm[p.cat][s]=[];cm[p.cat][s].push({...p,_i:i})});let html='';Object.keys(cm).forEach(cat=>{const sm=cm[cat];const ttl=Object.values(sm).reduce((s,a)=>s+a.length,0);const cid='c'+encodeURIComponent(cat);html+=`<div style="border-bottom:2px solid var(--primary-light)"><div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--primary-light);cursor:pointer" onclick="dq('${cid}').classList.toggle('open');this.querySelector('span').classList.toggle('open')"><div><span style="font-weight:700;color:var(--primary)">📂${cat}</span><span style="font-size:12px;color:var(--text2)">${ttl}型</span></div><span style="transition:transform .2s;font-size:12px;color:var(--text2)">▼</span></div><div id="${cid}" style="display:none">`;Object.keys(sm).forEach(s=>{const its=sm[s];const sl=s==='__'?'（无系列）':s;const sid=cid+'s'+s;html+=`<div style="border-bottom:1px solid var(--border)"><div style="padding:8px 16px 8px 24px;background:#fafafa;cursor:pointer;font-size:13px;color:var(--text2);font-weight:600" onclick="dq('${sid}').classList.toggle('open');this.querySelector('b').classList.toggle('open')">▸${sl}<b style="float:right;transition:transform .2s;font-weight:400">▼</b></div><div id="${sid}" style="display:none">`;its.forEach(p=>{html+=`<div style="display:flex;align-items:center;padding:8px 16px 8px 32px;border-top:1px solid var(--border);gap:8px"><div style="flex:1;font-size:14px">${p.m}</div><div style="color:var(--accent);font-weight:600;font-size:14px">¥${p.price}<span style="font-size:11px;color:#999;font-weight:400">/件</span></div><button class="btn btn-danger btn-sm" onclick="delP(${p._i})">删</button></div>`});html+=`</div></div>`});html+=`</div></div>`});l.innerHTML=html}
function delP(i){if(!confirm('删?'))return;const ps=DB.p;ps.splice(i,1);DB.p=ps;rp();sh('已删')}
function rh(){const h=DB.h;const ks=Object.keys(h).sort((a,b)=>b.localeCompare(a));dq('histCount').innerHTML=ks.length+'天';const l=dq('histList');if(!ks.length){l.innerHTML='<div class="empty-tip">暂无</div>';return}l.innerHTML=ks.map(k=>{const r=h[k];const tr0=r[0]?.t||0,tr1=r[1]?.t||0,tr2=r[2]?.t||0;const tot=tr0+tr2;return`<div style="border-bottom:1px solid var(--border)"><div style="padding:14px 16px;cursor:pointer" onclick="dq('hd${k}').classList.toggle('open')"><div style="display:flex;justify-content:space-between"><div><div style="font-weight:600">${fd(k)}</div><div style="font-size:12px;color:var(--text2)">提成¥${tr0} · 售后${tr1}次 · 报销¥${tr2}</div></div><div style="color:var(--accent);font-weight:700;font-size:18px">${tot>0?fm(tot):''}</div></div></div><div id="hd${k}" style="display:none;background:#f5f7fa;padding:10px 16px;font-size:13px"><p>提成:¥${tr0}</p><p>售后:${tr1}次</p><p>报销:¥${tr2}</p><button class="btn btn-danger btn-sm" onclick="delH('${k}')">删除</button></div></div>`}).join('')}
function delH(k){if(!confirm('删?'))return;const h=DB.h;delete h[k];DB.h=h;rh();sh('已删')}
function sh(msg){const t=dq('toast');t.innerHTML=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}
let tt;
function dq(id){return document.getElementById(id)}
function dqA(s){return document.querySelectorAll(s)}
const hdR=document.getElementById('headerRight'),fab=document.getElementById('fab');
(function init(){const d=new Date();dq('headerDate').innerText=`${d.getM()+1}月${d.getDate()}日`;rl(0)})();
</script></body>
