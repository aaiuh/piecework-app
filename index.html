<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计件记录</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#1976D2;--pl:#E3F2FD;--a:#FF6F00;--d:#E53935;--bg:#F5F7FA;--c:#fff;--t:#212121;--t2:#757575;--b:#E0E0E0}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:var(--bg);color:var(--t);height:100vh;display:flex;flex-direction:column}
.m{flex:1;overflow:hidden;display:flex;flex-direction:column}
.h{height:56px;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.tb{height:56px;background:var(--c);display:flex;border-top:1px solid var(--b)}
.tb button{flex:1;border:none;background:none;font-size:11px;color:var(--t2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tb button.active{color:var(--p)}
.tb button.active::after{content:'';position:absolute;top:0;left:10%;right:10%;height:3px;background:var(--p)}
.pg{display:none;flex:1;overflow-y:auto;padding:12px}
.pg.active{display:block}
.cd{background:var(--c);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:12px}
.ch{padding:12px 16px;background:var(--pl);display:flex;justify-content:space-between}
.ch h3{font-size:15px;color:var(--p)}
.sb{background:var(--p);color:#fff;padding:14px 16px;border-radius:12px;margin-bottom:12px;display:flex;justify-content:space-between}
.sb .l{font-size:13px;opacity:.85}
.sb .v{font-size:26px;font-weight:700}
.it{display:flex;padding:12px 16px;border-bottom:1px solid var(--b);gap:8px}
.it:last-child{border-bottom:none}
.it .info{flex:1}
.it .ti{font-size:15px;font-weight:600}
.it .mt{font-size:12px;color:var(--t2);margin-top:3px}
.it .am{font-size:15px;color:var(--a);font-weight:700}
.it .dl{background:none;border:none;font-size:20px;color:#ccc;cursor:pointer}
.abtn{width:100%;padding:12px;border:2px dashed var(--p);background:var(--pl);color:var(--p);border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.sv{padding:12px 16px;border-top:1px solid var(--b)}
.btns{display:flex;gap:10px;margin-top:18px}
.btns button{flex:1;padding:13px;border-radius:8px;font-size:15px;cursor:pointer}
.btns .p{background:var(--p);color:#fff;border:none}
.btns .g{background:transparent;color:var(--p);border:1px solid var(--p)}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end;justify-content:center}
.mo.open{display:flex}
.md{background:var(--c);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:20px;max-height:90vh;overflow-y:auto}
.md h3{font-size:17px;margin-bottom:16px;text-align:center}
.fg{margin-bottom:14px}
.fg label{font-size:13px;color:var(--t2);margin-bottom:5px;display:block}
.fg input,.fg textarea,.fg select{width:100%;border:1px solid var(--b);border-radius:10px;padding:11px;font-size:15px;background:var(--c)}
.fg textarea{height:80px;resize:none}
.sw{position:relative}
.sw::after{content:'▼';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--t2);pointer-events:none}
#fab{display:none;position:fixed;bottom:72px;right:16px;width:52px;height:52px;border-radius:50%;background:var(--a);color:#fff;font-size:28px;border:none;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer;z-index:50}
.ts{position:fixed;bottom:140px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:9px 20px;border-radius:20px;font-size:14px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.ts.show{opacity:1}
.bg{display:inline-block;background:var(--pl);color:var(--p);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
.em{text-align:center;color:var(--t2);padding:32px 16px}
</style>
</head>
<body>
<div class="h">
<div><div style="font-size:18px;font-weight:600">计件记录</div><div id="hd"></div></div>
<div id="hr" style="font-size:20px;font-weight:700;color:#FFD54F"></div>
</div>
<div class="m">
<div class="pg active" id="pg0">
<div class="sb"><div><div class="l">今日提成</div><div class="v" id="t0">¥0.00</div></div><div style="font-size:36px">$</div></div>
<div class="cd"><div class="ch"><h3>每日记录</h3><span class="bg" id="b0"></span></div><div id="l0"><div class="em">点击下方添加</div></div><div style="padding:12px;border-top:1px solid var(--b)"><button class="abtn" onclick="openM(0)">+ 添加</button></div><div class="sv" id="s0" style="display:none"><button class="btns p" onclick="saveD(0)">保存</button></div></div>
</div>
<div class="pg" id="pg1">
<div class="sb"><div><div class="l">售后次数</div><div class="v" id="t1">0</div></div><div style="font-size:36px">S</div></div>
<div class="cd"><div class="ch"><h3>售后记录</h3><span class="bg" id="b1"></span></div><div id="l1"><div class="em">点击下方添加</div></div><div style="padding:12px;border-top:1px solid var(--b)"><button class="abtn" onclick="openM(1)">+ 添加</button></div><div class="sv" id="s1" style="display:none"><button class="btns p" onclick="saveD(1)">保存</button></div></div>
</div>
<div class="pg" id="pg2">
<div class="sb"><div><div class="l">报销总额</div><div class="v" id="t2">¥0.00</div></div><div style="font-size:36px">M</div></div>
<div class="cd"><div class="ch"><h3>报销记录</h3><span class="bg" id="b2"></span></div><div id="l2"><div class="em">点击下方添加</div></div><div style="padding:12px;border-top:1px solid var(--b)"><button class="abtn" onclick="openM(2)">+ 添加</button></div><div class="sv" id="s2" style="display:none"><button class="btns p" onclick="saveD(2)">保存</button></div></div>
</div>
<div class="pg" id="pg3"><div class="cd"><div class="ch"><h3>产品库</h3><span class="bg" id="pc">0</span></div><div id="pl"><div class="em">暂无，点右下角+</div></div></div></div>
<div class="pg" id="pg4"><div class="cd"><div class="ch"><h3>历史</h3><span class="bg" id="hc">0</span></div><div id="hl"><div class="em">暂无</div></div></div></div>
<button id="fab" onclick="openPM()">+</button>
</div>
<div class="tb">
<button class="active" onclick="st(0)" id="tb0"><span style="font-size:17px">记</span>每日</button>
<button onclick="st(1)" id="tb1"><span style="font-size:17px">售</span>售后</button>
<button onclick="st(2)" id="tb2"><span style="font-size:17px">报</span>报销</button>
<button onclick="st(3)" id="tb3"><span style="font-size:17px">产</span>产品</button>
<button onclick="st(4)" id="tb4"><span style="font-size:17px">历</span>历史</button>
</div>
<div class="mo" id="m0"><div class="md"><h3>添加记录</h3>
<div class="fg"><label>类别*</label><div class="sw"><select id="sc" onchange="chc()"><option value="">--请选--</option></select></div></div>
<div class="fg" id="gs" style="display:none"><label>系列*</label><div class="sw"><select id="ss" onchange="chs()"><option value="">--请选--</option></select></div></div>
<div class="fg" id="gm" style="display:none"><label>型号*</label><div class="sw"><select id="sm" onchange="chm()"><option value="">--请选--</option></select></div></div>
<div class="fg" id="gp" style="display:none"><label>提成</label><div id="pd" style="padding:11px;background:#f5f7fa;border-radius:10px;font-size:16px;color:var(--a);font-weight:700"></div></div>
<div class="fg"><label>客户</label><input type="text" id="ic" placeholder="选填"></div>
<div class="fg"><label>地点</label><input type="text" id="il" placeholder="选填"></div>
<div class="fg"><label>数量*</label><input type="number" id="iq" min="1"></div>
<div class="btns"><button class="g" onclick="closeM(0)">取消</button><button class="p" onclick="addR(0)">添加</button></div></div></div>
<div class="mo" id="m1"><div class="md"><h3>添加售后</h3>
<div class="fg"><label>客户*</label><input type="text" id="i1c"></div>
<div class="fg"><label>地址*</label><input type="text" id="i1a"></div>
<div class="fg"><label>问题*</label><textarea id="i1p"></textarea></div>
<div class="fg"><label>结果*</label><textarea id="i1r"></textarea></div>
<div class="btns"><button class="g" onclick="closeM(1)">取消</button><button class="p" onclick="addR(1)">添加</button></div></div></div>
<div class="mo" id="m2"><div class="md"><h3>添加报销</h3>
<div class="fg"><label>类别*</label><input type="text" id="i2t"></div>
<div class="fg"><label>摘要*</label><textarea id="i2d"></textarea></div>
<div class="fg"><label>金额*</label><input type="number" id="i2a" step="0.01"></div>
<div class="btns"><button class="g" onclick="closeM(2)">取消</button><button class="p" onclick="addR(2)">添加</button></div></div></div>
<div class="mo" id="pm"><div class="md"><h3>添加产品</h3>
<div class="fg"><label>类别*</label><input type="text" id="pca"></div>
<div id="sl"></div>
<button class="abtn" onclick="addSB()" style="margin-bottom:12px">+系列</button>
<div class="btns"><button class="g" onclick="closePM()">取消</button><button class="p" onclick="saveBP()">保存</button></div></div></div>
<div class="ts" id="ts"></div>
<script>
var SP="pw_prods",SD="pw_drafts",SH="pw_hist";
function GP(){return JSON.parse(localStorage.getItem(SP)||"[]")}
function SP(v){localStorage.setItem(SP,JSON.stringify(v))}
function GD(){return JSON.parse(localStorage.getItem(SD)||"{}")}
function SD(v){localStorage.setItem(SD,JSON.stringify(v))}
function GH(){return JSON.parse(localStorage.getItem(SH)||"{}")}
function SH(v){localStorage.setItem(SH,JSON.stringify(v))}
function tk(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fd(k){var p=k.split("-");return p[0]+"年"+p[1]+"月"+p[2]+"日"}
function fm(n){return "¥"+Number(n).toFixed(2)}
function st(i){document.querySelectorAll(".tb button").forEach(function(b,j){b.classList.toggle("active",i===j)});document.querySelectorAll(".pg").forEach(function(p,j){p.classList.toggle("active",i===j)});document.getElementById("fab").style.display=i===3?"":"none";[0,1,2].forEach(function(j){if(i===j)rl(j);else document.getElementById("hr").innerHTML=""});if(i===3)rp();if(i===4)rh()}
function getD(t){var d=GD();if(!d[tk()])d[tk()]={0:[],1:[],2:[]};return d[tk()][t]}
function setD(t,v){var d=GD();if(!d[tk()])d[tk()]={0:[],1:[],2:[]};d[tk()][t]=v;SD(d)}
function rl(t){var d=getD(t),l=document.getElementById("l"+t),s=document.getElementById("s"+t),b=document.getElementById("b"+t);if(b)b.innerHTML=fd(tk()).replace(/\d{4}年/,"");if(!d.length){l.innerHTML='<div class="em">点击下方添加</div>';s.style.display="none";us(t,0);return}var h="",tot=0;d.forEach(function(it,ix){if(t===0){var pr=GP().find(function(x){return x.id===it.pid});if(!pr)return;var sb=it.q*pr.price;tot+=sb;var sm=[pr.s,pr.m].filter(Boolean).join("·");h+='<div class="it"><div class="info"><div class="ti">'+pr.cat+'</div><div class="mt">'+sm+"·¥"+Number(pr.price).toFixed(2)+"/件<br"+(it.c?"C "+it.c:"")+" "+(it.l?"L "+it.c:"")+'</div></div><div class="am">'+fm(sb)+'<div style="font-size:12px;color:var(--t2)">x'+it.q+'</div></div><button class="dl" onclick="rm('+t+","+ix+')">x</button></div>'}else if(t===1){tot+=1;h+='<div class="it"><div class="info"><div class="ti">'+it.c+'</div><div class="mt">A '+it.a+"<br>P "+it.p.substring(0,20)+"<br>R "+it.r.substring(0,20)+'</div></div><button class="dl" onclick="rm('+t+","+ix+')">x</button></div>'}else if(t===2){tot+=it.am;h+='<div class="it"><div class="info"><div class="ti">'+it.t+'</div><div class="mt">'+it.d+'</div></div><div class="am">'+fm(it.am)+'</div><button class="dl" onclick="rm('+t+","+ix+')">x</button></div>'}});l.innerHTML=h;s.style.display="block";us(t,tot)}
function us(t,total){if(t===0){document.getElementById("t0").innerHTML=fm(total);document.getElementById("hr").innerHTML=total>0?fm(total):""}else if(t===1){document.getElementById("t1").innerHTML=total;document.getElementById("hr").innerHTML=total>0?total+"ci":""}else if(t===2){document.getElementById("t2").innerHTML=fm(total);document.getElementById("hr").innerHTML=total>0?fm(total):""}}
function rm(t,ix){var d=getD(t);d.splice(ix,1);setD(t,d);rl(t)}
function saveD(t){var d=getD(t);if(!d.length){sh("请先添加");return}var k=tk(),h=GH();if(!h[k])h[k]={0:{i:[],t:0},1:{i:[],t:0},2:{i:[],t:0}};var total=d.reduce(function(s,x){if(t===0){var pr=GP().find(function(p){return p.id===x.pid});return s+(pr?x.q*pr.price:0)}else if(t===1){return s+1}else if(t===2){return s+x.am}return s},0);h[k][t]={i:d,t:total};SH(h);setD(t,[]);rl(t);sh("已保存")}
function openM(t){if(t===0){var ps=GP();if(!ps.length){sh("请先添加产品");return}var cs=[...new Set(ps.map(function(p){return p.cat}))];document.getElementById("sc").innerHTML="<option value=>--请选--</option>"+cs.map(function(c){return"<option value=\""+c+"\">"+c+"</option>"}).join("");["gs","gm","gp"].forEach(function(id){document.getElementById(id).style.display="none"});document.getElementById("iq").value="";document.getElementById("ic").value="";document.getElementById("il").value=""}else if(t===1){["i1c","i1a","i1p","i1r"].forEach(function(id){document.getElementById(id).value=""})}else if(t===2){["i2t","i2d","i2a"].forEach(function(id){document.getElementById(id).value=""})}document.getElementById("m"+t).classList.add("open")}
function closeM(t){document.getElementById("m"+t).classList.remove("open")}
function addR(t){var d=getD(t);if(t===0){var cat=document.getElementById("sc").value,series=document.getElementById("ss").value,model=document.getElementById("sm").value,qty=parseInt(document.getElementById("iq").value),c=document.getElementById("ic").value.trim(),l=document.getElementById("il").value.trim();if(!cat||!qty||qty<=0){sh("请填写完整");return}var pr=GP().find(function(p){return p.cat===cat&&(!series||p.s===series)&&(!model||p.m===model)});if(!pr){sh("请完整选择");return}d.push({pid:pr.id,q:qty,c:c,l:l})}else if(t===1){var c=document.getElementById("i1c").value.trim(),a=document.getElementById("i1a").value.trim(),p=document.getElementById("i1p").value.trim(),r=document.getElementById("i1r").value.trim();if(!c||!a||!p||!r){sh("请填写完整");return}d.push({c:c,a:a,p:p,r:r})}else if(t===2){var t2=document.getElementById("i2t").value.trim(),d2=document.getElementById("i2d").value.trim(),am=parseFloat(document.getElementById("i2a").value);if(!t2||!d2||!am||am<=0){sh("请填写完整");return}d.push({t:t2,d:d2,am:am})}setD(t,d);closeM(t);rl(t);sh("已添加")}
function chc(){var cat=document.getElementById("sc").value,ps=GP();["gs","gm","gp"].forEach(function(id){document.getElementById(id).style.display="none"});if(!cat)return;var ss=[...new Set(ps.filter(function(p){return p.cat===cat}).map(function(p){return p.s}).filter(Boolean))];if(ss.length){document.getElementById("ss").innerHTML="<option value=>--请选--</option>"+ss.map(function(s){return"<option value=\""+s+"\">"+s+"</option>"}).join("");document.getElementById("gs").style.display="block"}else{fm0(cat,"")}}
function chs(){var cat=document.getElementById("sc").value,series=document.getElementById("ss").value;if(!series)return;fm0(cat,series)}
function fm0(cat,series){var ps=GP();var ms=[...new Set(ps.filter(function(p){return p.cat===cat&&(series===""||p.s===series)}).map(function(p){return p.m}).filter(Boolean))];if(ms.length){document.getElementById("sm").innerHTML="<option value=>--请选--</option>"+ms.map(function(m){return"<option value=\""+m+"\">"+m+"</option>"}).join("");document.getElementById("gm").style.display="block"}else{sh0(cat,series,"")}}
function chm(){var cat=document.getElementById("sc").value,series=document.getElementById("ss").value,model=document.getElementById("sm").value;if(!model){document.getElementById("gp").style.display="none";return}sh0(cat,series,model)}
function sh0(cat,series,model){var pr=GP().find(function(p){return p.cat===cat&&(!series||p.s===series)&&(!model||p.m===model)});if(pr){document.getElementById("pd").innerHTML="¥"+Number(pr.price).toFixed(2)+"/件";document.getElementById("gp").style.display="block"}}
var sc=0;
function openPM(){document.getElementById("pca").value="";document.getElementById("sl").innerHTML="";sc=0;addSB();document.getElementById("pm").classList.add("open")}
function closePM(){document.getElementById("pm").classList.remove("open")}
function addSB(){sc++;var id="s"+sc;var h='<div style="background:#f5f7fa;border-radius:10px;padding:12px;margin-bottom:10px" id="'+id+'"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><label style="font-size:14px;font-weight:600;color:var(--p)">系列'+sc+'</label><button onclick="document.getElementById(\''+id+'\').remove()" style="background:none;border:none;color:var(--d);font-size:18px;cursor:pointer">x</button></div><input type="text" class="sname" placeholder="系列名" style="width:100%;padding:8px;font-size:14px;border:1px solid var(--b);border-radius:8px;margin-bottom:8px"><div class="ml"><div style="display:flex;gap:8px;margin-bottom:6px"><input type="text" placeholder="型号" class="mname" style="flex:1;padding:8px;font-size:14px;border:1px solid var(--b);border-radius:8px"><input type="number" placeholder="提成" class="pval" style="width:70px;padding:8px;font-size:14px;border:1px solid var(--b);border-radius:8px" step="0.01"><button onclick="this.parentElement.remove()" style="background:none;border:none;color:#ccc;font-size:18px;cursor:pointer">x</button></div></div><button onclick="addMI(\''+id+'\')" style="background:none;border:1px dashed var(--p);color:var(--p);border-radius:6px;padding:6px;font-size:12px;width:100%;margin-top:6px">+型号</button></div>';document.getElementById("sl").insertAdjacentHTML("beforeend",h)}
function addMI(sid){var el=document.getElementById(sid);var list=el.querySelector(".ml");var h='<div style="display:flex;gap:8px;margin-bottom:6px"><input type="text" placeholder="型号" class="mname" style="flex:1;padding:8px;font-size:14px;border:1px solid var(--b);border-radius:8px"><input type="number" placeholder="提成" class="pval" style="width:70px;padding:8px;font-size:14px;border:1px solid var(--b);border-radius:8px" step="0.01"><button onclick="this.parentElement.remove()" style="background:none;border:none;color:#ccc;font-size:18px;cursor:pointer">x</button></div>';list.insertAdjacentHTML("beforeend",h)}
function saveBP(){var cat=document.getElementById("pca").value.trim();if(!cat){sh("请填类别");return}var blocks=document.querySelectorAll("#sl>div");if(blocks.length===0){sh("请加系列");return}var np=[],hv=false;blocks.forEach(function(b){var sn=b.querySelector(".sname").value.trim();var ms=b.querySelectorAll(".ml>div");ms.forEach(function(m){var mn=m.querySelector(".mname").value.trim(),pv=parseFloat(m.querySelector(".pval").value);if(mn&&!isNaN(pv)&&pv>0){hv=true;np.push({id:Date.now()+Math.random(),cat:cat,s:sn,m:mn,price:pv})}})});if(!hv){sh("请填型号提成");return}var ps=GP();ps.push.apply(ps,np);SP(ps);closePM();rp();sh("已添加"+np.length+"个")}
function rp(){var ps=GP();document.getElementById("pc").innerHTML=ps.length;var l=document.getElementById("pl");if(!ps.length){l.innerHTML='<div class="em">暂无，点右下角+</div>';return}var cm={};ps.forEach(function(p,i){if(!cm[p.cat])cm[p.cat]={};var s=p.s||"__";if(!cm[p.cat][s])cm[p.cat][s]=[];cm[p.cat][s].push({...p,_i:i})});var h="";Object.keys(cm).forEach(function(cat){var sm=cm[cat];var ttl=Object.values(sm).reduce(function(s,a){return s+a.length},0);var cid="c"+encodeURIComponent(cat);h+='<div style="border-bottom:2px solid var(--pl)"><div style="padding:12px 16px;background:var(--pl);cursor:pointer" onclick="document.getElementById(\''+cid+'\').classList.toggle(\'open\')"><span style="font-weight:700;color:var(--p)">'+cat+'</span><span style="font-size:12px;color:var(--t2)">'+ttl+'型</span></div><div id="'+cid+'" style="display:none">';Object.keys(sm).forEach(function(s){var its=sm[s];var sl=s==="__"?"无系列":s;var sid=cid+"s"+s;h+='<div style="border-bottom:1px solid var(--b)"><div style="padding:8px 16px 8px 24px;background:#fafafa;cursor:pointer;font-size:13px;color:var(--t2);font-weight:600" onclick="document.getElementById(\''+sid+'\').classList.toggle(\'open\')">'+sl+'</div><div id="'+sid+'" style="display:none">';its.forEach(function(p){h+='<div style="display:flex;padding:8px 16px 8px 32px;border-top:1px solid var(--b);gap:8px"><div style="flex:1;font-size:14px">'+p.m+'</div><div style="color:var(--a);font-weight:700;font-size:14px">¥'+Number(p.price).toFixed(2)+'</div><button class="btns p" style="padding:5px 10px;font-size:12px" onclick="delP('+p._i+')">删</button></div>'});h+="</div></div>"});h+="</div></div>"});l.innerHTML=h}
function delP(i){if(!confirm("删?"))return;var ps=GP();ps.splice(i,1);SP(ps);rp();sh("已删")}
